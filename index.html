<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java MCQ Quiz</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#6b7280;--accent:#4f46e5;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--border:#e5e7eb}
  @media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--text:#e8eaf0;--muted:#9aa1b0;--accent:#818cf8;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--border:#2b3040}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
  label.row{display:flex;align-items:center;gap:10px;margin:8px 0;cursor:pointer}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
  .chip{padding:8px 16px;border:1px solid var(--border);border-radius:999px;cursor:pointer;background:var(--card);color:var(--text);font-size:.95rem}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary,button.secondary{font-size:1rem;padding:10px 20px;border-radius:10px;border:1px solid var(--accent);cursor:pointer}
  button.primary{background:var(--accent);color:#fff}
  button.secondary{background:transparent;color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 16px}
  .bar>div{height:100%;background:var(--accent);transition:width .2s}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
  .qtext{font-size:1.05rem;font-weight:600;white-space:pre-wrap;margin-bottom:16px}
  .qtext code,.opt code{font-family:ui-monospace,Menlo,Consolas,monospace}
  pre.code{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;font-size:.88rem;margin:10px 0 0;font-weight:400;white-space:pre}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:.95rem;cursor:pointer;font-family:inherit}
  .opt:hover:not(.locked){border-color:var(--accent)}
  .opt .k{font-weight:700;min-width:22px;color:var(--muted)}
  .opt .t{white-space:pre-wrap;word-break:break-word}
  .opt.sel{border-color:var(--accent)}
  .opt.correct{border-color:var(--ok);background:var(--okbg)}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .opt.locked{cursor:default}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
  .score{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
  .center{text-align:center}
  .rev{border-left:4px solid var(--border);padding-left:12px;margin:14px 0}
  .rev.ok{border-color:var(--ok)}.rev.no{border-color:var(--bad)}
  .small{font-size:.9rem;color:var(--muted)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>☕ Java MCQ Quiz</h1>
  <div class="sub">Unit 3 &amp; Unit 4 question banks</div>
  <div id="app"></div>
</div>
<script src="questions.js"></script>
<script>
const app = document.getElementById('app');
const L = ['A','B','C','D'];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let state = {};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Split a question into prose + code (code starts after first newline)
function fmtQ(q){
  const i = q.indexOf('\n');
  if(i<0) return esc(q);
  return esc(q.slice(0,i)) + '<pre class="code">' + esc(q.slice(i+1)) + '</pre>';
}

function home(){
  const sel = state.units || ['unit3','unit4'];
  app.innerHTML = `
  <div class="card">
    <b>Choose units</b>
    <div class="chips" id="units">
      <span class="chip ${sel.includes('unit3')?'on':''}" data-u="unit3">Unit 3 (50)</span>
      <span class="chip ${sel.includes('unit4')?'on':''}" data-u="unit4">Unit 4 (50)</span>
    </div>
    <b>Number of questions</b>
    <div class="chips" id="counts">
      ${[10,25,50,100,'All'].map(n=>`<span class="chip ${(state.count||'All')==n?'on':''}" data-n="${n}">${n}</span>`).join('')}
    </div>
    <label class="row"><input type="checkbox" id="shuf" ${state.shuffle!==false?'checked':''}> Shuffle questions</label>
    <label class="row"><input type="checkbox" id="shufo" ${state.shuffleOpts?'checked':''}> Shuffle answer options</label>
    <label class="row"><input type="checkbox" id="instant" ${state.instant!==false?'checked':''}> Show answer immediately after each question</label>
    <div style="margin-top:16px"><button class="primary" id="start">Start Quiz</button></div>
  </div>`;
  state.units = [...sel]; state.count = state.count||'All';
  document.querySelectorAll('#units .chip').forEach(c=>c.onclick=()=>{
    const u=c.dataset.u; const i=state.units.indexOf(u);
    if(i>=0) state.units.splice(i,1); else state.units.push(u);
    c.classList.toggle('on'); document.getElementById('start').disabled = !state.units.length;
  });
  document.querySelectorAll('#counts .chip').forEach(c=>c.onclick=()=>{
    state.count=c.dataset.n; document.querySelectorAll('#counts .chip').forEach(x=>x.classList.toggle('on',x===c));
  });
  document.getElementById('start').disabled = !state.units.length;
  document.getElementById('start').onclick = start;
}

function start(){
  state.shuffle = document.getElementById('shuf').checked;
  state.shuffleOpts = document.getElementById('shufo').checked;
  state.instant = document.getElementById('instant').checked;
  let pool = [];
  state.units.forEach(u=>QUESTIONS[u].forEach((q,i)=>pool.push({...q,unit:u==='unit3'?'Unit 3':'Unit 4',n:i+1})));
  if(state.shuffle) pool = shuffle(pool);
  if(state.count!=='All') pool = pool.slice(0,+state.count);
  pool = pool.map(q=>{
    let idx=[0,1,2,3]; if(state.shuffleOpts) idx=shuffle(idx);
    return {...q, o: idx.map(i=>q.o[i]), a: idx.indexOf(q.a)};
  });
  state.qs = pool; state.i = 0; state.ans = new Array(pool.length).fill(null);
  render();
}

function render(){
  const q = state.qs[state.i], total = state.qs.length, chosen = state.ans[state.i];
  const locked = state.instant && chosen!==null;
  app.innerHTML = `
  <div class="meta"><span>Question ${state.i+1} of ${total}</span><span>${q.unit} · Q${q.n}</span></div>
  <div class="bar"><div style="width:${(state.i+1)/total*100}%"></div></div>
  <div class="card">
    <div class="qtext">${fmtQ(q.q)}</div>
    ${q.o.map((t,i)=>{
      let cls='opt';
      if(locked){cls+=' locked'; if(i===q.a)cls+=' correct'; else if(i===chosen)cls+=' wrong';}
      else if(i===chosen) cls+=' sel';
      return `<button class="${cls}" data-i="${i}"><span class="k">${L[i]}.</span><span class="t">${esc(t)}</span></button>`;
    }).join('')}
    ${locked?`<div class="small">${chosen===q.a?'✅ Correct!':'❌ Incorrect — correct answer is '+L[q.a]+'.'}</div>`:''}
  </div>
  <div class="nav">
    <button class="secondary" id="prev" ${state.i===0?'disabled':''}>← Previous</button>
    <button class="secondary" id="quit">Quit</button>
    <button class="primary" id="next">${state.i===total-1?'Finish':'Next →'}</button>
  </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(locked) return;
    state.ans[state.i]=+b.dataset.i; render();
  });
  document.getElementById('prev').onclick=()=>{state.i--;render()};
  document.getElementById('next').onclick=()=>{
    if(state.i===total-1){ if(state.ans.includes(null) && !confirm(state.ans.filter(a=>a===null).length+' question(s) unanswered. Finish anyway?')) return; results(); }
    else {state.i++;render()}
  };
  document.getElementById('quit').onclick=()=>{ if(confirm('Quit this quiz?')) home(); };
}

function results(){
  const total=state.qs.length;
  const correct=state.qs.filter((q,i)=>state.ans[i]===q.a).length;
  const pct=Math.round(correct/total*100);
  const wrong=state.qs.map((q,i)=>({q,i})).filter(({q,i})=>state.ans[i]!==q.a);
  app.innerHTML = `
  <div class="card center">
    <div class="small">Your score</div>
    <div class="score">${correct} / ${total}</div>
    <div>${pct}% — ${pct>=80?'Excellent! 🎉':pct>=60?'Good job 👍':'Keep practising 📚'}</div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${wrong.length?'<button class="primary" id="retry">Retry wrong ones ('+wrong.length+')</button>':''}
      <button class="secondary" id="again">New quiz</button>
    </div>
  </div>
  ${wrong.length?'<h3>Review: questions you missed</h3>':'<h3>Perfect score — nothing to review!</h3>'}
  ${wrong.map(({q,i})=>`
    <div class="card">
      <div class="small">${q.unit} · Q${q.n}</div>
      <div class="qtext">${fmtQ(q.q)}</div>
      <div class="rev no"><b>Your answer:</b> ${state.ans[i]===null?'<i>Not answered</i>':L[state.ans[i]]+'. '+esc(q.o[state.ans[i]])}</div>
      <div class="rev ok"><b>Correct answer:</b> ${L[q.a]}. ${esc(q.o[q.a])}</div>
    </div>`).join('')}`;
  document.getElementById('again').onclick=home;
  const r=document.getElementById('retry');
  if(r) r.onclick=()=>{ state.qs=wrong.map(w=>w.q); state.i=0; state.ans=new Array(state.qs.length).fill(null); render(); };
}
home();
</script>
</body>
</html>
